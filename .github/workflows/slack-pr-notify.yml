name: 'Slack PR Notification'
on:
  pull_request:
    types:
      - opened

env:
  js-sdk-channel-id: C0958RN2ZTR

defaults:
  run:
    shell: bash

permissions:
  contents: read
  pull-requests: read

jobs:
  notify-dependabot:
    name: Notify Slack (Dependabot)
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - name: Send Slack Notification
        uses: slackapi/slack-github-action@b0fa283ad8fea605de13dc3f449259339835fc52 # v2.1.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ env.js-sdk-channel-id }}",
              "text": ":robot_face: New Dependabot PR: <${{ github.event.pull_request.html_url }}|${{ github.event.pull_request.title }}>"
            }

  notify-slack:
    name: Notify Slack
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - name: Prepare PR description
        id: desc
        run: |
          DESC=$(cat <<'EOFBODY'
          ${{ github.event.pull_request.body }}
          EOFBODY
          )
          DESC=$(echo "$DESC" | sed 's/^[[:space:]]*//')
          if [ -z "$DESC" ]; then
            DESC="_No description provided._"
          elif [ ${#DESC} -gt 300 ]; then
            DESC="${DESC:0:300}..."
          fi
          {
            echo "body<<EOFMULTI"
            echo "$DESC"
            echo "EOFMULTI"
          } >> "$GITHUB_OUTPUT"

      - name: Send Slack Notification
        uses: slackapi/slack-github-action@b0fa283ad8fea605de13dc3f449259339835fc52 # v2.1.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ env.js-sdk-channel-id }}",
              "text": "New PR opened: <${{ github.event.pull_request.html_url }}|${{ github.event.pull_request.title }}>",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rocket: *New Pull Request Opened*\n*<${{ github.event.pull_request.html_url }}|${{ github.event.pull_request.title }}>*"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Author:*\n${{ github.event.pull_request.user.login }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Description:*\n${{ steps.desc.outputs.body }}"
                  }
                }
              ]
            }
