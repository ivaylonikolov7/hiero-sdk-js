/**
 * Common message types shared across services, queries, and transactions.
 * Deduplicated from services.proto, transaction_core.proto, query_response.proto,
 * transaction_contents.proto, transaction_response.proto.
 */
syntax = "proto3";

package proto;

option java_package = "com.hederahashgraph.api.proto.java";
option java_multiple_files = true;

import "basic_types.proto";
import "timestamp.proto";
import "duration.proto";
import "response_code.proto";

/**
 * A wrapper for signed transaction bytes.
 */
message Transaction {
    bytes signedTransactionBytes = 5;
}

/**
 * A transaction response.
 */
message TransactionResponse {
    ResponseCodeEnum nodeTransactionPrecheckCode = 1;
    uint64 cost = 2;
}

/**
 * A query wrapper.
 */
message Query {
    oneof query {
        bytes queryBytes = 100;
    }
}

/**
 * A response wrapper.
 */
message Response {
    oneof response {
        bytes responseBytes = 100;
    }
}

/**
 * Response type.
 */
enum ResponseType {
    ANSWER_ONLY = 0;
    ANSWER_STATE_PROOF = 1;
    COST_ANSWER = 2;
    COST_ANSWER_STATE_PROOF = 3;
}

/**
 * A query header.
 */
message QueryHeader {
    Transaction payment = 1;
    ResponseType responseType = 2;
}

/**
 * A response header.
 */
message ResponseHeader {
    ResponseCodeEnum nodeTransactionPrecheckCode = 1;
    ResponseType responseType = 2;
    uint64 cost = 3;
    bytes stateProof = 4;
}

/**
 * Signed transaction.
 */
message SignedTransaction {
    bytes bodyBytes = 1;
    SignatureMap sigMap = 2;
}

/**
 * Transaction body (minimal, no oneof data).
 */
message TransactionBody {
    TransactionID transactionID = 1;
    AccountID nodeAccountID = 2;
    uint64 transactionFee = 3;
    Duration transactionValidDuration = 4;
    bool generateRecord = 5 [deprecated = true];
    string memo = 6;
}

/**
 * A list of transactions.
 */
message TransactionList {
    repeated Transaction transaction_list = 1;
}
